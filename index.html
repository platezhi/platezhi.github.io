<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платежи — вход</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#eef3fb,#f7f8fa);color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:32px 28px;max-width:400px;width:100%;text-align:center}
.logo{font-size:40px}
h1{font-size:24px;margin:8px 0 4px}
p.sub{color:#6b7280;margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:#0d4cd3;color:#fff}
.btn:hover{background:#0b3fb0}
.mark{display:inline-flex;width:24px;height:24px;border-radius:6px;background:#fff;color:#0d4cd3;font-weight:800;align-items:center;justify-content:center;font-size:14px}
.demo{margin-top:18px;font-size:12px;color:#b45309;background:#fef3c7;border-radius:8px;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.overlay .box{max-width:340px}
.spin{width:36px;height:36px;border:4px solid #dbe4f5;border-top-color:#0d4cd3;border-radius:50%;margin:10px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🏠</div>
  <h1>Коммунальные платежи</h1>
  <p class="sub">Все счета за квартиру в одном месте</p>
  <button class="btn" onclick="login()"><span class="mark">Г</span>Войти через Госуслуги</button>
  <div class="demo">Демо-версия: настоящий вход не выполняется, логин и пароль не запрашиваются.</div>
</div>
<div class="overlay" id="ov"><div class="box"><div class="spin"></div><p>Подключение к Госуслугам (демо)…</p></div></div>
<script>
function login(){
  document.getElementById('ov').style.display='flex';
  setTimeout(function(){localStorage.setItem('demoUser','Владимир');location.href='cabinet.html';},1500);
}
</script>
</body>
</html>
