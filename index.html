<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои документы — вход (демо)</title>
<style>
:root{--accent:#c8603f;--accent-bg:#f7ecea;--accent-bg-h:#efdbd6}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;background:#f2f2f2;color:#2b2b2b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:32px 28px;max-width:400px;width:100%;text-align:center}
.logo{font-weight:700;font-size:24px;letter-spacing:.3px;color:#1d1d1d;margin-bottom:14px}.logo b{color:var(--accent)}
h1{font-size:24px;margin:8px 0 4px}
p.sub{color:#8a8a8a;margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:0;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent-bg);color:var(--accent)}
.btn:hover{background:var(--accent-bg-h)}
.btn,.btn:focus,.btn:active{outline:none;box-shadow:none;border:0}
.mark{display:inline-flex;width:24px;height:24px;border-radius:4px;background:var(--accent);color:#fff;font-weight:800;align-items:center;justify-content:center;font-size:14px}
.demo{margin-top:18px;font-size:12px;color:var(--accent);background:var(--accent-bg);border-radius:8px;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.overlay .box{max-width:340px}
.spin{width:36px;height:36px;border:4px solid var(--accent-bg-h);border-top-color:var(--accent);border-radius:50%;margin:10px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">МОИ <b>ДОКУМЕНТЫ</b></div>
  <h1>Коммунальные платежи</h1>
  <p class="sub">Все счета за квартиру в одном месте</p>
  <button class="btn" onclick="login()"><span class="mark">Г</span>Войти через Госуслуги</button>
  <div class="demo">Демо-версия: настоящий вход не выполняется, логин и пароль не запрашиваются.</div>
</div>
<div class="overlay" id="ov"><div class="box"><div class="spin"></div><p>Подключение к Госуслугам (демо)…</p></div></div>
<script>
function login(){
  document.getElementById('ov').style.display='flex';
  setTimeout(function(){localStorage.setItem('demoUser','Владимир');location.href='cabinet.html';},1500);
}
</script>
</body>
</html>
