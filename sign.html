<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Подписание договора (демо) — Мои документы</title>
<link rel="stylesheet" href="deal.css?v=19">
<style id="ctcss"></style>
</head>
<body class="dp hasbar">
<header class="top"><div class="top-in"><div class="logo">МОИ <b>ДОКУМЕНТЫ</b></div><span class="chip acc">демо</span></div></header>
<main class="page" id="app"></main>
<div class="abar" id="bar"></div>
<script src="qrcode.js?v=19"></script>
<script src="deal.js?v=19"></script>
<script src="back.js?v=19"></script>
<script>
(function(){
  var D=window.DemoDeal,app=document.getElementById('app'),bar=document.getElementById('bar'),esc=D.esc;
  document.getElementById('ctcss').textContent=D.CT_CSS;
  var NOTE='<div class="demo-note">Демо: никаких реальных входов, СМС, подписей и платежей. Данные «из Госуслуг» — вымышленные. Всё сохраняется только в этом браузере (localStorage); чтобы подпись дошла до владельца с другого устройства, нужен сервер.</div>';
  var q=new URLSearchParams(location.search),x=D.fromLink(D.dec(q.get('c')));
  function back(objId){return '<a class="back" href="cabinet.html#rent'+(objId?'-'+encodeURIComponent(objId):'')+'" data-back>В кабинет владельца (демо)</a>';}
  function noBar(){bar.style.display='none';document.body.classList.remove('hasbar');}
  if(!x){noBar();app.innerHTML=back('')+'<div class="card"><h1>Ссылка недействительна</h1><p class="sub">Не удалось прочитать данные договора. Попросите владельца отправить ссылку ещё раз.</p>'+NOTE+'</div>';return;}
  var d=D.get(x.id)||x,LK='demoTenantLogin_'+d.id,objId=d.objId||x.objId;
  function logged(){try{return localStorage.getItem(LK)==='1';}catch(e){return false;}}
  function profile(){var p=Object.assign({},D.TENANT_DEMO);p.phone=d.phone||'';return p;}
  function done(){
    noBar();
    var paid=d.status==='paid'||(d.status==='ended'&&d.paidT);
    app.innerHTML=back(objId)+(paid?'<div class="card">'+D.qrCard(d,'Моё проживание')+'</div>':'<div class="card"><div class="ok-big">✓ Договор подписан и отправлен владельцу</div><p class="sub">Спасибо, '+esc(d.tenant.fio)+'! Владелец подпишет договор со своей стороны и пришлёт ссылку на оплату первого месяца и залога (демо).</p>'+NOTE+'</div>')+
      '<div class="card"><h2>Ваш экземпляр</h2><div class="ct-box full">'+D.contractHtml(d)+'</div></div>';
  }
  if(d.status==='cancelled'||(d.status==='ended'&&!(d.tenant&&d.tenant.sig))){noBar();app.innerHTML=back(objId)+'<div class="card"><h1>Предложение отозвано</h1><p class="sub">Владелец отменил это предложение.</p>'+NOTE+'</div>';return;}
  if(d.tenant&&d.tenant.sig){done();return;}
  function render(){
    var L=logged(),p=profile(),c=L?Object.assign({},d,{tenant:p}):d;
    app.innerHTML=back(objId)+'<div class="card"><h1>Подписание договора</h1><p class="sub">'+esc(D.OWNER)+' предлагает вам '+(D.isStorage(d)?'аренду кладовой':'найм квартиры')+': '+esc(d.addr)+', '+D.rub(d.price)+' в месяц, залог '+D.rub(d.deposit)+'</p>'+
      (d.inv&&d.inv.length?'<p class="sub">В конце договора — <b>Приложение №1. Опись имущества</b> ('+d.inv.length+' предм.): проверьте перечень и состояние вещей.</p>':'')+
      (L?'':'<p class="sub">Чтобы подписать, войдите через Госуслуги (демо) — ваши данные подставятся в договор автоматически.</p>')+NOTE+'</div>'+
      (L?'<div class="card"><h2>Ваши данные <span class="src">получено из Госуслуг (демо)</span></h2><div class="kv"><span>ФИО</span><b>'+esc(p.fio)+'</b><span>Дата рождения</span><b>'+esc(p.birth)+'</b><span>Паспорт</span><b>'+esc(p.passport)+'</b><span>Регистрация</span><b>'+esc(p.reg)+'</b><span>Телефон</span><b>'+esc(p.phone||'—')+'</b></div></div>':'')+
      (d.ins?'<div class="card"><h2>Страхование</h2><div class="demo-note">'+D.INS_NOTE+'</div>'+D.insCard(c,'tenant')+'</div>':'')+
      '<div class="card"><h2>Договор</h2><div class="ct-box" id="ct">'+D.contractHtml(c,{tap:'T'})+'</div></div>';
    bar.innerHTML='<div class="abar-in">'+(L?'<button class="btn solid" type="button" id="go">Подписать</button><small>Подписание через Госуслуги (демо) — одно подтверждение</small>'
      :'<button class="btn solid" type="button" id="login"><span class="g-mark">Г</span>Войти через Госуслуги</button><small>Демо: логин и пароль не запрашиваются</small>')+'</div>';
  }
  function login(){D.gosLogin(function(){try{localStorage.setItem(LK,'1');}catch(e){}render();window.scrollTo(0,0);});}
  function sign(){
    var p=profile();
    D.gosSign({doc:D.ctTitle(d)+' · '+d.addr,who:p.fio},function(t){
      var cur=D.get(d.id)||d;
      if(cur.status==='cancelled'||cur.status==='ended'){alert('Владелец отозвал предложение');location.reload();return;}
      cur.tenant={fio:p.fio,birth:p.birth,passport:p.passport,reg:p.reg,phone:p.phone,sig:'gos',via:'gos',t:t};
      cur.status='tenant_signed';D.put(cur);d=cur;window.scrollTo(0,0);done();
    });
  }
  document.addEventListener('click',function(e){var t=e.target;
    if(t.closest('#login'))login();
    else if(t.closest('#go'))sign();
    else if(t.closest('[data-tsign]')){if(logged())sign();else login();}
  });
  render();
})();
</script>
</body>
</html>
