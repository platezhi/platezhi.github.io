<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Копировать исходный код реферата</title><style>body{font:17px -apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:620px;margin:12vh auto;padding:24px;line-height:1.5}button{width:100%;border:0;border-radius:14px;background:#173b74;color:white;font-size:19px;font-weight:600;padding:20px}#status{margin-top:18px;color:#445}textarea{position:fixed;left:-9999px;top:0}</style></head><body><h1>Исходный код реферата</h1><p>Нажмите кнопку, чтобы скопировать весь HTML, CSS и JavaScript в буфер обмена iPhone.</p><button id="copy">Скопировать весь код</button><p id="status" role="status"></p><script>document.getElementById('copy').addEventListener('click',async()=>{const status=document.getElementById('status');status.textContent='Загружаю код…';try{const r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.text();if(!s.includes('<!DOCTYPE html>'))throw Error('Файл не найден');try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.focus();t.select();if(!document.execCommand('copy'))throw e;t.remove()}status.textContent='Готово! Весь код скопирован ('+Math.round(s.length/1024)+' КБ). Теперь можно вставить его в редактор.'}catch(e){status.textContent='Не удалось скопировать: '+e.message+'. Откройте страницу в Safari.'}})</script></body></html>
